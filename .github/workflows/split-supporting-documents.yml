name: Fix supporting document review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-supporting-documents.yml'

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix review supporting document rows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""    if (el.type === 'file') {
      if (selectedSupportingFiles.length) current.rows.push({label:'Selected files', value:selectedSupportingFiles.map(x=>x.category + ': ' + x.file.name).join(', ')});
      return;
    }"""
          new="""    if (el.type === 'file') {
      const category = el.dataset.category || 'Supporting Documents';
      const categoryFiles = selectedSupportingFiles.filter(x => x.category === category);
      if (categoryFiles.length) {
        current.rows.push({label: category, value: categoryFiles.map(x => x.file.name).join(', ')});
      }
      return;
    }"""
          assert old in s, 'Review file-input block not found'
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit form update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix duplicate supporting documents in review"
          git push
