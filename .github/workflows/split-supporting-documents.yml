name: Update needs analysis form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-supporting-documents.yml'

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move Applicant 2 button and add applicant-aware progress
        run: python3 .github/update-applicant-progress-and-button.py
      - name: Commit form update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Move Applicant 2 control and add applicant progress indicator"
          git push
