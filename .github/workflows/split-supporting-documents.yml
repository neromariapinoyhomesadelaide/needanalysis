name: Fix GitHub Pages function endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-supporting-documents.yml'

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use full Netlify function URL on GitHub Pages
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); old=\"const SEND_EMAIL_ENDPOINT = '/.netlify/functions/send-email';\"; new=\"const SEND_EMAIL_ENDPOINT = 'https://dreamy-taiyaki-dded84.netlify.app/.netlify/functions/send-email';\"; assert old in s, 'Relative Netlify endpoint not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit form update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix secure upload endpoint for GitHub Pages"
          git push
