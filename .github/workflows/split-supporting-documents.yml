name: Update needs analysis form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-supporting-documents.yml'

permissions:
  contents: write

jobs:
  update-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update progress navigation
        run: python3 .github/update-progress-review-submit.py
      - name: Commit form update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Remove Additional Information and add Review and Submit progress step"
          git push
