name: Apply secure upload index patch

on:
  push:
    branches: [main]
    paths:
      - '.github/index-secure-upload.patch'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply index patch
        run: git apply --whitespace=nowarn .github/index-secure-upload.patch
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update form with secure supporting document uploads"
          git push
